{% extends "base.html" %}

{% block title %}Статистика — Личные финансы{% endblock %}

{% block content %}
<h1>Статистика расходов</h1>
<p>Общая сумма расходов: <strong>{{ total }} руб.</strong></p>

<table class="table table-striped">
    <thead>
        <tr><th>Категория</th><th>Сумма</th></tr>
    </thead>
    <tbody>
        {% for row in rows %}
        <tr><td>{{ row.category }}</td><td>{{ row.amount }} руб.</td></tr>
        {% empty %}
        <tr><td colspan="2">Данных нет.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
