{% extends "base.html" %}

{% block title %}Дорогие категории{% endblock %}

{% block content %}
<h1>Категории с суммой &gt; 500 руб.</h1>
<table class="table table-striped">
    <thead><tr><th>Категория</th><th>Сумма</th></tr></thead>
    <tbody>
    {% for c in categories %}
    <tr><td>{{ c.name }}</td><td>{{ c.total|floatformat:2 }} руб.</td></tr>
    {% empty %}
    <tr><td colspan="2">Нет таких категорий.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
